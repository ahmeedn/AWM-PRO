    <style>
       * { margin:0; padding:0; box-sizing:border-box; }

/* -------- Body -------- */
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #1e1e2f, #2c2c3f);

/* -------- Container -------- */

    background: rgba(30,30,40,0.95);

}

/* -------- Title -------- */
h1 {
    text-align:center;
    font-size:2.5em;
    color:#00ffff;
    font-weight:700;
    margin-bottom:40px;
}

 .upload-area {
    border:3px dashed #00ffff;

    padding:50px;

    transition:all 0.3s ease;
    background:#2a2a3a;

}
.upload-area:hover {

}
.upload-area.dragover {

    border-color: #00cccc;
}
.upload-icon { font-size:4em; color:#00ffff; margin-bottom:20px; }
input[type="file"]{ display:none; }


        input[type="file"] {
            display: none;
        }

.files-list { margin-top:30px; max-height:500px; overflow-y:auto; }

/* -------- File Item Card -------- */
.file-item {
    background:#2a2a3a;

    margin-bottom:20px;

    display:flex;

.file-item.dragging{ opacity:0.5; }
.file-info {

}

/* أيقونة الملف */
.file-icon {

}

/* تفاصيل الملف (اسم وحجم وعدد الصفحات) */

}

/* اسم الملف */

.file-item.placeholder {

}

.file-item.dragging {

    box-shadow: 0 8px 20px rgba(0,255,255,0.5);

    transition: none; /* إزالة الانتقال أثناء السحب */
}


/* حجم الملف */
.file-size {

}

/* عدد الصفحات */
.file-pages {

}


.file-actions {
    display: flex;

}
.pdf-preview {
    margin-top: 10px;
    border: 1px solid #ccc;
    border-radius: 5px;
width: 100px;

}

}

/* الحاوية اللي فيها اسم الملف والحقل */

}

/* حقل الإدخال */

/* تأثير عند التركيز */

}

        .status-message {

        }
/* الحاوية */
#totalSize {

}

/* النص قبل الرقم */


/* لو حجم الملفات قريب من الحد الأقصى */
#totalSize.warning {
    color: #fff;
    background-color: #e74c3c; /* أحمر */

}

/* لو الحجم آمن */
#totalSize.safe {
    color: #fff;
    background-color: #2ecc71; /* أخضر */
    border-color: #27ae60;
}

        .status-message.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }
    /* الرقم اللي يوضح ترتيب الملف */
.file-item .num {
    display: inline-block;
    width: 30px;         /* عرض ثابت للرقم */
    height: 30px;        /* ارتفاع متساوي مع العرض */
    line-height: 30px;   /* لمحاذاة الرقم عموديًا */
    text-align: center;  /* لمحاذاة الرقم أفقيًا */
    background-color: #000000; /* لون خلفية جميل */
    color: white;        /* لون النص */
    font-weight: bold;
    border-radius: 10px;  /* دائرة كاملة */

    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
}

/* لو حبيت الرقم أكبر شوي عند hover على الملف */


        .status-message.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }

        .status-message.loading {

        /* ------------------ Responsive ------------------ */
@media screen and (max-width: 768px) {

    .upload-area { padding:30px; }

    </style>
</head>
<body>
    <div id="loading" style="
    display:none; justify-content:center; align-items:center; 
                         position:fixed; 
                         top:0; left:0; 
                         width:100%; height:100%; 
                         background:rgba(0,0,0,0.6); 
                         color:#00ffff; font-size:1.5em; 
                         z-index:1000;">
    جاري معالجة الملفات يمكن أن يستغرق بعض الوقت...
</div>

    <div class="container">
        
        <h1>دمج ملفات PDF</h1>
        
        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📁</div>
            <h3>اسحب وأفلت ملفات PDF هنا</h3>
            <p>أو انقر للاختيار من جهازك</p>
            <input type="file" id="fileInput" accept=".pdf" multiple>
        </div>
        <div class="file-final-name">
            <div>
                <span style="z-index: 1000;">اجمالي الحجم</span><br><div id="totalSize">300MB / 0 Bytes</div>
            </div>

            <span class="warning-msg">
ملاحظة: إذا تركت الحقل فارغاً، سيتم حفظ الملف باسم "merged.pdf" افتراضياً
</span>

    <span>اسم الملف النهائي</span>
    <div>
        pdf.<input id="inputname" type="text" placeholder="اكتب اسم الملف هنا">
    </div>
</div>




        <div class="files-list" id="filesList"></div>

        <button class="btn-send" id="sendBtn" disabled>دمج الملفات</button>

        <div class="status-message" id="statusMessage"></div>
    </div>

    <script>
        // ضع هنا عنوان السيرفر الخاص بك
        const SERVER_URL = 'https://awmdsdsaf.pythonanywhere.com/pdf';
        
        // ضع هنا مفتاح API إذا كان مطلوباً (أو اتركه فارغاً)

let draggedItem = null;
let startY = 0;
let placeholder = null; // عنصر وهمي يظهر مكان العنصر أثناء السحب

        let files = [];

        
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const filesList = document.getElementById('filesList');
        const sendBtn = document.getElementById('sendBtn');
        const statusMessage = document.getElementById('statusMessage');

        // رفع الملفات عند النقر
        uploadArea.addEventListener('click', () => fileInput.click());

        // منع السلوك الافتراضي للسحب والإفلات
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            uploadArea.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        // تأثيرات السحب
        ['dragenter', 'dragover'].forEach(eventName => {
            uploadArea.addEventListener(eventName, () => {
                uploadArea.classList.add('dragover');
            });
        });

        ['dragleave', 'drop'].forEach(eventName => {
            uploadArea.addEventListener(eventName, () => {
                uploadArea.classList.remove('dragover');
            });
        });

        // معالجة الإفلات
        uploadArea.addEventListener('drop', (e) => {
            const droppedFiles = e.dataTransfer.files;
            handleFiles(droppedFiles);
        });

        // معالجة اختيار الملفات
        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
        });

let totalSize = 0; // حجم كل الملفات بالبايت
const maxSize = 300 * 1024 * 1024; // 300MB
async function handleFiles(newFiles) {
    for (let file of newFiles) {
        if (file.type === 'application/pdf') {
            const base64 = await convertToBase64(file);

            files.push({
                id: Date.now() + Math.random(),
                file: file,
                name: file.name,
                size: formatFileSize(file.size),
                rawSize: Number(file.size) || 0,  // ← مهم جداً
                base64: base64
            });
        }
    }

    // حساب المجموع مع فلترة الملفات اللي فيها حجم
    totalSize = files.reduce((sum, f) => sum + (f.rawSize || 0), 0);

    // عرض الحجم
    document.getElementById("totalSize").textContent = 
        ` 300MB / ${formatFileSize(totalSize)}`;

    // تحقق من الحد الأقصى
    if (totalSize > 300 * 1024 * 1024) {
        showStatus('error', "حجم الملفات أكبر من 300MB، حاول رفع ملفات أصغر");
        sendBtn.disabled = true;
    } else {
        sendBtn.disabled = files.length === 0;
    }
    renderFiles();
    updateSendButton();
}


        function convertToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => {
                    const base64String = reader.result.split(',')[1];
                    resolve(base64String);
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        function formatFileSize(bytes) {
    if (!bytes) return '0 Bytes';
    const k = 1024;
    const sizes = ['Bytes', 'KB', 'MB', 'GB'];
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    return (bytes / Math.pow(k, i)).toFixed(2) + ' ' + sizes[i];
}

const pdfPages = {}; // لتخزين كل PDF لكل canvas
function moveUp(index) {
    if (index === 0) return;
    [files[index - 1], files[index]] = [files[index], files[index - 1]];
    renderFiles();
}

function moveDown(index) {
    if (index === files.length - 1) return;
    [files[index], files[index + 1]] = [files[index + 1], files[index]];
    renderFiles();
}

function renderFiles() {
    filesList.innerHTML = '';

    files.forEach((file, index) => {
        const fileItem = document.createElement('div');
        fileItem.className = 'file-item';
        fileItem.draggable = true;
        fileItem.dataset.index = index;

        const canvasId = `pdf-canvas-${index}`;
        file.size
        fileItem.innerHTML = `
            <span class="num">${index+1}</span>
            <span class="drag-handle">☰</span>
            <div class="file-info">
                <span class="file-icon">📄</span>
                <div class="file-details">
                    <div class="file-name">${file.name}</div>
                    <div class="file-size">${file.size}</div>
                    <div class="file-pages">الصفحات: <span id="page-count-${index}">0</span></div>
                </div>
            </div>
            <canvas id="${canvasId}" class="pdf-preview"></canvas>
            <div class="file-actions">
                 <button class="btn-move-up" onclick="moveUp(${index})">⬆</button>
    <button class="btn-move-down" onclick="moveDown(${index})">⬇</button>
                <button class="btn-delete" onclick="deleteFile(${index})">⨉</button>
                <button class="btn-zoom" onclick="openModal('${canvasId}')">⛶</button>
            </div>
        `;

        // Desktop drag & drop
        fileItem.addEventListener('dragstart', handleDragStart);
        fileItem.addEventListener('dragend', handleDragEnd);
        fileItem.addEventListener('dragover', handleDragOver);
        fileItem.addEventListener('drop', handleDrop);


        // Touch Events
 

  

     
        filesList.appendChild(fileItem);

        // تحويل Base64 لUint8Array
        const pdfBytes = base64ToUint8Array(file.base64);

        // تحميل PDF
        pdfjsLib.getDocument({data: pdfBytes}).promise.then(pdfDoc => {
            pdfPages[canvasId] = { pdfDoc, pageNum: 1, scale: 1.0 };

            // تحديث عدد الصفحات
            const pageCountSpan = document.getElementById(`page-count-${index}`);
            if (pageCountSpan) pageCountSpan.textContent = pdfDoc.numPages;

            // عرض أول صفحة
            renderPage(canvasId);
        });
    });
}
// دالة تحويل Base64 لUint8Array
function base64ToUint8Array(base64) {
    const binaryString = atob(base64);
    const len = binaryString.length;
    const bytes = new Uint8Array(len);
    for (let i = 0; i < len; i++) {
        bytes[i] = binaryString.charCodeAt(i);
    }
    return bytes;
}

// دالة عرض الصفحة
 // لتخزين كل PDF info
function renderPage(canvasId, pageNum = 1) {
    const canvasObj = pdfPages[canvasId];
    if (!canvasObj) return;

    const { pdfDoc, scale } = canvasObj;

    pdfDoc.getPage(pageNum).then(page => {
        const viewport = page.getViewport({ scale });
        const canvas = document.getElementById(canvasId);
        const context = canvas.getContext('2d');

        canvas.width = viewport.width;
        canvas.height = viewport.height;

        // إذا فيه render جاري، ألغيه
        if (canvasObj.renderTask) {
            canvasObj.renderTask.cancel();
        }

        // بدء render جديد
        canvasObj.renderTask = page.render({ canvasContext: context, viewport });
        canvasObj.renderTask.promise.then(() => {
            canvasObj.renderTask = null; // انتهت العملية
        }).catch(err => {
            if (err?.name !== 'RenderingCancelledException') {
                console.error(err);
            }
        });
    });
}
        function handleDragStart(e) {
            draggedItem = this;
            this.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
        }

        function handleDragEnd(e) {
            this.classList.remove('dragging');
        }

        function handleDragOver(e) {
            if (e.preventDefault) {
                e.preventDefault();
            }
            e.dataTransfer.dropEffect = 'move';
            return false;
        }

        function handleDrop(e) {
            if (e.stopPropagation) {
                e.stopPropagation();
            }

            if (draggedItem !== this) {
                const draggedIndex = parseInt(draggedItem.dataset.index);
                const targetIndex = parseInt(this.dataset.index);
                
                const draggedFile = files[draggedIndex];
                files.splice(draggedIndex, 1);
                files.splice(targetIndex, 0, draggedFile);
                
                renderFiles();
            }
            return false;
        }
        function openModal(canvasId){
            document.querySelector(`#${canvasId}`).classList.add('fullscreen');
            let cosebtn = document.createElement('button');
            cosebtn.textContent = 'إغلاق';
            cosebtn.style.position = 'fixed';
            cosebtn.style.top = '20px';
            cosebtn.style.right = '20px';
            cosebtn.style.padding = '10px 20px';
            
            document.body.appendChild(cosebtn);
            cosebtn.addEventListener('click', function(){
                document.querySelector(`#${canvasId}`).classList.remove('fullscreen');
                document.body.removeChild(cosebtn);
            });
            
            
            
        }





        function deleteFile(index) {
            files.splice(index, 1);
            renderFiles();
            updateSendButton();
        }

        window.deleteFile = deleteFile;

        function updateSendButton() {
            sendBtn.disabled = files.length === 0;
        }

     sendBtn.addEventListener('click', async () => {
          if (totalSize > maxSize) {
        showStatus('error', "حجم الملفات أكبر من 300MB، لا يمكن الإرسال");
        return;
    }
    showStatus('loading', 'جاري إرسال الملفات...');
    sendBtn.disabled = true;

    const loading = document.getElementById("loading");
    loading.style.display = "flex";

    try {
        const formData = new FormData();

        files.forEach((f, index) => {
            formData.append("files", f.file); // ← Blob / File
            formData.append("order", index + 1);
        });

        const response = await fetch(SERVER_URL, {
            method: "POST",
            body: formData // ⚠️ لا تضع headers
        });

        if (!response.ok) {
            throw new Error(`خطأ في السيرفر: ${response.status}`);
        }

        // السيرفر بيرجع PDF merged كـ Blob
        const mergedPdfBlob = await response.blob();

        const link = document.createElement("a");
        link.href = URL.createObjectURL(mergedPdfBlob);
        link.download = inputname.value.trim() || "merged.pdf";
        document.body.appendChild(link);
        link.click();
        link.remove();

        showStatus('success', `تم إرسال ${files.length} ملف بنجاح! ✅`);
        files = [];
        renderFiles();

    } catch (error) {
        showStatus('error', `فشل الإرسال: ${error.message}`);
    } finally {
        loading.style.display = "none";
        updateSendButton();
    }
});



        function showStatus(type, message) {
            statusMessage.className = `status-message ${type}`;
            statusMessage.textContent = message;
            
            if (type !== 'loading') {
                setTimeout(() => {
                    statusMessage.style.display = 'none';
                }, 5000);
            }
        }
    </script>
