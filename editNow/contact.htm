<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اتصل بنا</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            padding: 40px 20px;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 3em;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #00d4ff, #7b2ff7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        header p {
            font-size: 1.2em;
            color: #a0a0a0;
        }

        .content-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 40px;
        }

        .contact-form {
            background: rgba(30, 30, 46, 0.9);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .contact-form h2 {
            color: #00d4ff;
            font-size: 2em;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            color: #b0b0b0;
            font-size: 1.05em;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 15px;
            background: rgba(20, 20, 30, 0.8);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: white;
            font-size: 1em;
            transition: all 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 150px;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #00d4ff, #7b2ff7);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 1.1em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.4);
        }

        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .info-card {
            background: rgba(30, 30, 46, 0.9);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s;
        }

        .info-card:hover {
            transform: translateY(-5px);
            border-color: #00d4ff;
        }

        .info-card h3 {
            color: #00d4ff;
            font-size: 1.5em;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .info-card p {
            color: #b0b0b0;
            font-size: 1.05em;
            line-height: 1.8;
        }

        .info-card a {
            color: #7b2ff7;
            text-decoration: none;
            transition: color 0.3s;
        }

        .info-card a:hover {
            color: #00d4ff;
        }

        .icon {
            font-size: 1.5em;
        }

        .social-links {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }

        .social-btn {
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(20, 20, 30, 0.8);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            color: #00d4ff;
            font-size: 1.3em;
            transition: all 0.3s;
            cursor: pointer;
            text-decoration: none;
        }

        .social-btn:hover {
            background: linear-gradient(135deg, #00d4ff, #7b2ff7);
            color: white;
            transform: scale(1.1);
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #a0a0a0;
        }

        .nav-links {
            margin-bottom: 20px;
        }

        .nav-links a {
            color: #00d4ff;
            text-decoration: none;
            margin: 0 15px;
            font-weight: 600;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: #7b2ff7;
        }

        @media (max-width: 968px) {
            .content-wrapper {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 2.5em;
            }

            .contact-form,
            .info-card {
                padding: 25px;
            }
        }

        @media (max-width: 568px) {
            header h1 {
                font-size: 2em;
            }

            body {
                padding: 10px;
            }
        }
    </style>
</head>
<body>

        </p>
        </div>

        </div>
        
        <div class="info-card">

        <div class="social-links">

        </div> 
        </div> 
        </div> 
        </div>
        
        <footer>
        
        <div class="nav-links">
        
        <a href="./index.html">Home</a>
        
        </div>
        
        <p> Ahmed-AWM © 2025 All Rights Reserved</p>
        
        </footer>
        
        </div>
    <script>
        document.getElementById('contactForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = this.querySelector('.submit-btn');
            const originalText = submitBtn.textContent;
            submitBtn.textContent = 'Submitting...';
            submitBtn.disabled = true;
            
            const formData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                subject: document.getElementById('subject').value,
                message: document.getElementById('message').value,
                date: new Date().toISOString()
            };
            
            try {
                const response = await fetch('https://691d0545d58e64bf0d34be18.mockapi.io/msg-E', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });
                
                if (response.ok) {
const result = await response.json();
alert(`✅ Thank you ${formData.name}!\n\nYour message has been sent successfully.\nWe will contact you soon at:\n${formData.email}`);

this.reset();

} else {
throw new Error('Failed to send message');

}
} catch (error) {
console.error('Error:', error);

alert('❌ Sorry, there was an error sending the message.\nPlease try again.');
            } finally {
                submitBtn.textContent = originalText;
                submitBtn.disabled = false;
            }
        });

        const inputs = document.querySelectorAll('input, textarea');
        inputs.forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.style.transform = 'translateX(-5px)';
            });
            
            input.addEventListener('blur', function() {
                this.parentElement.style.transform = 'translateX(0)';
            });
        });
    </script>
</body>
</html>
